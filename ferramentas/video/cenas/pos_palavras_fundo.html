<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><title>palavras soltas translúcidas</title></head>
<body>
<!--
  Palavras da fala soltas no fundo da moldura: contorno laranja, preenchimento quase transparente, cada uma entra
  na palavra dita e fica derivando devagar até a moldura acabar. Só nas faixas livres (lados e base do quadro),
  nunca em cima da lista, do medidor ou do rosto.
-->
<template id="pos_palavras_fundo-template">
<style>
@font-face{font-family:Montserrat;src:url("assets/fontes/Montserrat.ttf") format("truetype");font-weight:100 900;font-display:block}
#root{position:absolute;inset:0;overflow:hidden;font-family:Montserrat}
.ppf-eixo{position:absolute;width:0;height:0}
.ppf-anda{position:absolute;left:0;top:0;opacity:0}
.ppf-txt{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;font-weight:900;
  letter-spacing:.04em;color:rgba(255,255,255,.07);-webkit-text-stroke:2px rgba(255,140,60,.95)}
#ppf-e1{left:74px;top:1150px;transform:rotate(-90deg)}
#ppf-e2{left:1006px;top:1150px;transform:rotate(90deg)}
#ppf-e3{left:540px;top:1835px}
#ppf-e4{left:540px;top:150px}
#ppf-t1,#ppf-t2{font-size:104px}
#ppf-t3{font-size:72px}
#ppf-t4{font-size:92px}
</style>
<div id="root" data-composition-id="pos_palavras_fundo" data-width="1080" data-height="1920" data-duration="7.52">
  <div class="ppf-eixo" id="ppf-e1"><div class="ppf-anda" id="ppf-a1"><span class="ppf-txt" id="ppf-t1">FORTALECIMENTO</span></div></div>
  <div class="ppf-eixo" id="ppf-e2"><div class="ppf-anda" id="ppf-a2"><span class="ppf-txt" id="ppf-t2">REABILITAÇÃO</span></div></div>
  <div class="ppf-eixo" id="ppf-e3"><div class="ppf-anda" id="ppf-a3"><span class="ppf-txt" id="ppf-t3">ACOMPANHAMENTO</span></div></div>
  <div class="ppf-eixo" id="ppf-e4"><div class="ppf-anda" id="ppf-a4"><span class="ppf-txt" id="ppf-t4">COMPETIR</span></div></div>
</div>
<script>
(function () {
  // palavras do trecho em segundos da cena; aberta sozinha no estúdio a cena usa os valores padrão
  const C = (window.__cenas || {})["pos_palavras_fundo"] || { palavras: [], duracao: 7.52, moldura: { fechada_em: 0.7 } };
  const DUR = C.duracao;
  const fechada = C.moldura ? C.moldura.fechada_em || 0 : 0;
  const sem = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const em = (texto, depois, padrao) => {
    const p = (C.palavras || []).find((w) => w.t >= depois - 1e-3 && sem(w.texto).startsWith(sem(texto)));
    return p ? p.t : padrao;
  };
  // cada palavra: quando entra, o quanto deriva ao longo do eixo dela e a opacidade final (as de lado mais fortes)
  const itens = [
    { id: 1, t: em("fortalec", 0, 0.1), anda: 70, alpha: 0.5 },
    { id: 2, t: em("reabilit", 0, 1.36), anda: -70, alpha: 0.5 },
    { id: 3, t: em("acompanh", 0, 4.18), anda: 50, alpha: 0.42 },
    { id: 4, t: em("competir", 0, 6.53), anda: -40, alpha: 0.42 },
  ];
  const sai = Math.max(0.5, DUR - 0.35);
  const tl = gsap.timeline({ paused: true });
  itens.forEach((it) => {
    const t0 = Math.min(Math.max(it.t - 0.05, fechada + 0.05), sai - 0.6);
    const sel = "#ppf-a" + it.id;
    // entra subindo e clareando; depois deriva devagar no próprio eixo até a moldura acabar
    tl.fromTo(sel, { opacity: 0, y: 34 }, { opacity: it.alpha, y: 0, duration: 0.7, ease: "power2.out" }, t0);
    tl.fromTo(sel, { x: 0 }, { x: it.anda, duration: Math.max(0.1, sai - t0), ease: "none", immediateRender: false }, t0);
    tl.to(sel, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, sai);
  });
  window.__timelines["pos_palavras_fundo"] = tl;
})();
</script>
</template>
</body>
</html>
