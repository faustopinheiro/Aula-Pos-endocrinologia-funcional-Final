<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1120" width="1280" height="1120" role="img" aria-label="Seis variacoes circulares do simbolo do curso, comparadas com a versao aprovada, cada uma em tamanho grande, tamanho pequeno e sobre fundo escuro">
  <defs>
    <g id="a" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M75.9,28.5 A34,34 0 1,0 75.9,67.5"/>
      <path d="M58,48 L68,48 L73.5,35 L80,61 L85,48 L94,48"/>
    </g>
    <g id="v1" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="48" cy="48" r="34" stroke-width="7"/>
      <path d="M27,48 L36,48 L41,37 L47,61 L52,45 L57,48 L69,48" stroke-width="6"/>
    </g>
    <g id="v2" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="48" cy="48" r="30"/>
      <path d="M4,48 L26,48 L33,33 L41,65 L48,44 L54,48 L92,48"/>
    </g>
    <g id="v3" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M81.5,42.1 A34,34 0 0,0 36.4,16.1"/>
      <path d="M26.1,22.0 A34,34 0 0,0 26.1,74.1"/>
      <path d="M36.4,80.0 A34,34 0 0,0 81.5,53.9"/>
      <path d="M62,48 L71,48 L76,37 L82,60 L87,48 L94,48"/>
    </g>
    <g id="v4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="48" cy="48" r="28" stroke-width="7"/>
      <path d="M30,48 L38,48 L43,38 L48,59 L53,46 L58,48 L66,48" stroke-width="5.5"/>
      <path d="M84.3,31.1 A40,40 0 0,0 64.9,11.8" stroke-width="6"/>
      <path d="M89.6,24.0 A48,48 0 0,0 72.0,6.4" stroke-width="5"/>
    </g>
    <g id="v5" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M75.9,28.5 A34,34 0 1,0 75.9,67.5"/>
      <path d="M58,48 C64,48 66,33 72,33 C78,33 80,63 86,63 C90,63 92,48 96,48"/>
    </g>
    <g id="v6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M31,18.6 A34,34 0 1,0 65,18.6" stroke-width="7"/>
      <path d="M24,58 L34,58 L41,10 L48,74 L55,50 L62,58 L72,58" stroke-width="6"/>
    </g>
  </defs>

  <rect width="1280" height="1120" fill="#F7F6F2"/>
  <text x="64" y="68" font-family="Georgia, serif" font-size="34" fill="#12202E">Variacoes no mesmo espirito do circulo</text>
  <text x="64" y="100" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#4A5A68">Cada uma em tamanho grande, a 36 pixels e sobre fundo escuro.</text>

  <rect x="64" y="126" width="1152" height="134" rx="12" fill="#EDEAE2"/>
  <use href="#a" stroke="#12202E" transform="translate(92,140) scale(1.1)"/>
  <text x="232" y="180" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#12202E">Referencia: o anel de pulso que voce aprovou</text>
  <text x="232" y="208" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4A5A68">As seis abaixo mudam o que a linha faz dentro ou ao redor do mesmo circulo.</text>

  <g transform="translate(64,300)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#A8322A">1. Pulso contido</text>
    <text x="0" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4A5A68">Anel inteiro, batimento guardado dentro.</text>
    <use href="#v1" stroke="#12202E" transform="translate(0,40) scale(1.15)"/>
    <use href="#v1" stroke="#12202E" transform="translate(140,75) scale(0.375)"/>
    <rect x="200" y="40" width="150" height="112" rx="10" fill="#12202E"/>
    <use href="#v1" stroke="#F7F6F2" transform="translate(240,52) scale(0.75)"/>
  </g>

  <g transform="translate(480,300)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#A8322A">2. Linha que atravessa</text>
    <text x="0" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4A5A68">O traco entra, cruza e continua fora.</text>
    <use href="#v2" stroke="#12202E" transform="translate(0,40) scale(1.15)"/>
    <use href="#v2" stroke="#12202E" transform="translate(140,75) scale(0.375)"/>
    <rect x="200" y="40" width="150" height="112" rx="10" fill="#12202E"/>
    <use href="#v2" stroke="#F7F6F2" transform="translate(240,52) scale(0.75)"/>
  </g>

  <g transform="translate(896,300)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#A8322A">3. Tres arcos</text>
    <text x="0" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4A5A68">Tres partes que formam um so anel.</text>
    <use href="#v3" stroke="#12202E" transform="translate(0,40) scale(1.15)"/>
    <use href="#v3" stroke="#12202E" transform="translate(140,75) scale(0.375)"/>
    <rect x="200" y="40" width="150" height="112" rx="10" fill="#12202E"/>
    <use href="#v3" stroke="#F7F6F2" transform="translate(240,52) scale(0.75)"/>
  </g>

  <g transform="translate(64,660)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#A8322A">4. Anel que irradia</text>
    <text x="0" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4A5A68">Batimento dentro, alcance para fora.</text>
    <use href="#v4" stroke="#12202E" transform="translate(0,40) scale(1.15)"/>
    <use href="#v4" stroke="#12202E" transform="translate(140,75) scale(0.375)"/>
    <rect x="200" y="40" width="150" height="112" rx="10" fill="#12202E"/>
    <use href="#v4" stroke="#F7F6F2" transform="translate(240,52) scale(0.75)"/>
  </g>

  <g transform="translate(480,660)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#A8322A">5. Respiracao</text>
    <text x="0" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4A5A68">A mesma abertura, com onda em vez de pico.</text>
    <use href="#v5" stroke="#12202E" transform="translate(0,40) scale(1.15)"/>
    <use href="#v5" stroke="#12202E" transform="translate(140,75) scale(0.375)"/>
    <rect x="200" y="40" width="150" height="112" rx="10" fill="#12202E"/>
    <use href="#v5" stroke="#F7F6F2" transform="translate(240,52) scale(0.75)"/>
  </g>

  <g transform="translate(896,660)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#A8322A">6. Pulso que cresce</text>
    <text x="0" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4A5A68">Abertura no topo, o traco sai por ela.</text>
    <use href="#v6" stroke="#12202E" transform="translate(0,40) scale(1.15)"/>
    <use href="#v6" stroke="#12202E" transform="translate(140,75) scale(0.375)"/>
    <rect x="200" y="40" width="150" height="112" rx="10" fill="#12202E"/>
    <use href="#v6" stroke="#F7F6F2" transform="translate(240,52) scale(0.75)"/>
  </g>

  <text x="64" y="1060" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4A5A68">Todas em traco unico, fundo transparente, recoloriveis, e ja testadas no tamanho de rodape.</text>
</svg>
